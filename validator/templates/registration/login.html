<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Export Shipment Control</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b0d10;
            color: #f5f5f5;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .eyebrow {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #9ca3af;
            margin-bottom: 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .subtitle {
            margin-top: 10px;
            color: #9ca3af;
            font-size: 15px;
        }

        .login-card {
            background: #15181d;
            border: 1px solid #292d33;
            border-radius: 16px;
            padding: 30px;
        }

        .login-card h2 {
            margin: 0 0 24px;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #d1d5db;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 14px;

            background: #0b0d10;
            color: #f5f5f5;

            border: 1px solid #292d33;
            border-radius: 8px;

            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #6b7280;
        }

        .error {
            background: #1d1517;
            border: 1px solid #3b2528;
            color: #fca5a5;

            padding: 12px 14px;
            border-radius: 8px;

            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        button {
            width: 100%;
            padding: 13px 16px;

            background: #f5f5f5;
            color: #0b0d10;

            border: none;
            border-radius: 8px;

            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            background: #d1d5db;
        }

        .footer-note {
            text-align: center;
            margin-top: 22px;

            color: #6b7280;
            font-size: 12px;
        }

        .back {
            display: block;
            text-align: center;

            margin-top: 24px;

            color: #9ca3af;
            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {
            color: #f5f5f5;
            text-decoration: underline;
        }

        @media (max-width: 500px) {

            .header h1 {
                font-size: 26px;
            }

            .login-card {
                padding: 24px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="header">

        <div class="eyebrow">
            Export Shipment Control
        </div>

        <h1>
            Internal Dashboard
        </h1>

        <p class="subtitle">
            Sign in to access validation activity.
        </p>

    </div>


    <div class="login-card">

        <h2>
            Sign In
        </h2>


        {% if form.errors %}

            <div class="error">
                Your username or password is incorrect.
                Please try again.
            </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}


            <div class="form-group">

                <label for="id_username">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="id_password">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    autocomplete="current-password"
                    required
                >

            </div>


            {% if next %}

                <input
                    type="hidden"
                    name="next"
                    value="{{ next }}"
                >

            {% endif %}


            <button type="submit">
                Sign In
            </button>

        </form>


        <div class="footer-note">
            Internal access only
        </div>

    </div>


    <a href="/" class="back">
        ← Back to website
    </a>

</div>

</body>
</html>
